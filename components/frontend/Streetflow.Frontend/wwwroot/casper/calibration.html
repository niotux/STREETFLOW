<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050201"><title>Casper · Set up camera view</title>
  <link rel="stylesheet" href="/ui/streetflow-ui.css?v=taskbar-1"><link rel="stylesheet" href="/magi.css?v=taskbar-1"><link rel="stylesheet" href="/casper/style.css?v=taskbar-1">
  <script type="module" src="/casper/calibration.js?v=easy-1"></script>
</head>
<body class="magi-page calibration-page">
  <header class="ui-taskbar">
    <a class="ui-taskbar-logo" href="/" title="MAGI component selection"><img src="/ui/streetflow-logo.png" alt="Streetflow"></a>
    <div class="ui-taskbar-end"><span class="ui-taskbar-component">Casper</span></div>
  </header>
  <main class="casper-layout">
    <nav class="casper-crumbs" aria-label="Page navigation"><a id="back-map" href="/casper/">← Back to device map</a></nav>
    <div class="casper-intro"><h1>Set this camera’s counting area</h1></div>
    <p class="casper-note">The bright outline marks where cars are counted. To change it, drag a box over the road in the picture, then press Save changes.</p>
    <div class="calibration-tools">
      <label>Camera <select id="camera"></select></label>
      <button id="refresh-picture" type="button">Refresh picture</button>
      <button id="start-over" type="button">Start over</button>
      <button id="save-camera" type="button">Save changes</button>
    </div>
    <p id="feedback" role="status">Loading camera…</p>
    <canvas id="calibration-canvas" width="960" height="540" aria-label="Camera picture and counting area"></canvas>
    <p class="casper-note">The camera picks up saved changes automatically. Start over restores the last saved area.</p>
  </main>
</body>
</html>
