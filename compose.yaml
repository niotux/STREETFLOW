name: streetflow-simulation
services:
  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8090}:8080"
    environment:
      Frontend__SimulatorBaseUrl: "http://simulator:8080"
      Frontend__LogisticsBaseUrl: "http://logistics:8080"
      Frontend__CasperBaseUrl: "http://casper:8080"
    depends_on:
      simulator:
        condition: service_healthy
      logistics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  logistics:
    build:
      context: .
      target: logistics
    ports:
      - "127.0.0.1:${LOGISTICS_PORT:-8081}:8080"
    environment:
      Logistics__TacoApiBaseUrl: "http://simulator:8080"
      Logistics__ConnectionFile: "/app/data/connection.json"
    volumes:
      - logistics-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  casper:
    build:
      context: .
      target: casper
    ports:
      - "127.0.0.1:${CASPER_PORT:-8082}:8080"
    environment:
      Casper__ConfigurationFile: /config/configuration.json
      Casper__CalibrationDirectory: /app/data/calibrations
      CASPER_DEMO_CAMERA_TOKEN: "${CASPER_DEMO_CAMERA_TOKEN:-}"
    volumes:
      - ${CASPER_CONFIG_FILE:-./components/detector/examples/configuration.json}:/config/configuration.json:ro
      - ./components/detector/examples/camera.json:/config/camera.json:ro
      - casper-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  simulator:
    build:
      context: .
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-8080}:8080"
    environment:
      Simulator__ConnectionString: "${SIMULATOR_CONNECTION_STRING:-}"
      Simulator__ProjectsRoot: /projects
    volumes:
      - simulator-data:/app/data
      # Project folders and ZIPs on this machine. Change STREETFLOW_PROJECTS_DIR in .env, then run `docker compose up -d simulator`.
      - ${STREETFLOW_PROJECTS_DIR:-./projects}:/projects:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    profiles: [recording]
    image: postgres:18.3
    environment:
      POSTGRES_DB: streetflow_simulator
      POSTGRES_USER: streetflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-streetflow-local}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetflow -d streetflow_simulator"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  simulator-data:
  postgres-data:
  logistics-data:
  casper-data:
