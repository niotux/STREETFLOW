name: streetflow-simulation
services:
  simulator:
    build:
      context: .
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-8080}:8080"
    environment:
      Simulator__ConnectionString: "Host=postgres;Database=streetflow_simulator;Username=streetflow;Password=${POSTGRES_PASSWORD:-streetflow-local}"
    volumes:
      - simulator-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: streetflow_simulator
      POSTGRES_USER: streetflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-streetflow-local}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetflow -d streetflow_simulator"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  simulator-data:
  postgres-data:
