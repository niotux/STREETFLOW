services:
  casper:
    environment:
      Casper__EnablePreview: "true"
      CASPER_DEMO_CAMERA_TOKEN: "${CASPER_DEMO_CAMERA_TOKEN:?Set CASPER_DEMO_CAMERA_TOKEN in .env}"
  camera-demo:
    profiles: [camera-demo]
    build:
      context: ./components/detector/camera
    init: true
    read_only: true
    user: "65534:65534"
    environment:
      CASPER_DEMO_CAMERA_TOKEN: "${CASPER_DEMO_CAMERA_TOKEN:?Set CASPER_DEMO_CAMERA_TOKEN in .env}"
    volumes:
      - ./components/detector/examples/camera.json:/config/camera.json:ro
      - ${CAMERA_DEMO_VIDEO:?Set CAMERA_DEMO_VIDEO in .env}:/video/source:ro
      - ${CAMERA_DEMO_MODEL:?Set CAMERA_DEMO_MODEL in .env}:/model/model.onnx:ro
    command: ["--config", "/config/camera.json", "--casper", "http://casper:8080", "--source", "/video/source", "--model", "/model/model.onnx", "--fetch-calibration", "--preview"]
    depends_on:
      casper:
        condition: service_healthy
